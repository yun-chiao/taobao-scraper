    function drawArt(canvas, kind, variant) {
      const w = canvas.width;
      const h = canvas.height;
      const ctx = canvas.getContext('2d');
      const bgs = [
        ['#F6F2EB', '#E7DFD2'],
        ['#EFECE6', '#DDD6C9'],
        ['#F8F6F2', '#EAE4DA'],
        ['#ECE8E1', '#D6CEC0'],
      ];
      const [c1, c2] = bgs[variant % bgs.length];
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, c1);
      g.addColorStop(1, c2);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(w / 2, h / 2);
      const scale = w / 520;
      ctx.scale(scale, scale);

      if (kind === 'earring') {
        ctx.strokeStyle = variant % 2 === 1 ? '#A8A9AD' : '#B99256';
        ctx.lineWidth = 26;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(-34, 8, 72, Math.PI * 0.2, Math.PI * 1.75);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(42, 22, 66, Math.PI * 0.25, Math.PI * 1.8);
        ctx.stroke();
      } else if (kind === 'pearl') {
        ctx.strokeStyle = '#C7A46C';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, -20, 130, Math.PI * 0.12, Math.PI * 0.88);
        ctx.stroke();
        [-95, -58, -22, 16, 54, 90].forEach((x, idx) => {
          const y = -20 + Math.sqrt(Math.max(0, 130 * 130 - x * x));
          ctx.fillStyle = idx === 2 ? '#FDFBF7' : '#F5EFE4';
          ctx.beginPath();
          ctx.ellipse(x, y, idx === 2 ? 22 : 14, idx === 2 ? 27 : 15, 0.2 * idx, 0, Math.PI * 2);
          ctx.fill();
        });
      } else {
        ctx.rotate(-0.22 + variant * 0.08);
        ctx.fillStyle = variant % 2 === 0 ? '#6E472B' : '#C8B69E';
        ctx.beginPath();
        ctx.roundRect(-125, -36, 250, 72, 34);
        ctx.fill();
        ctx.fillStyle = 'rgba(246,242,235,0.85)';
        ctx.beginPath();
        ctx.roundRect(-85, -12, 170, 24, 12);
        ctx.fill();
      }
      ctx.restore();
    }

                <div class="row small muted" id="spPreorderDaysRow">
                  <span>我需要</span>
                  <input type="number" class="input" style="width:76px;padding:4px 8px;" data-shopee-field="daysToShip" placeholder="7~20" />
                  <span>個工作天出貨</span>
                </div>
              </div>
            </div>
          </section>

          <div class="sp-footer-bar" id="spFooterBar">
            <button type="button" class="btn btn-secondary" id="spSaveDraftBtn">儲存並下架（草稿）</button>
            <button type="button" class="btn-shopee" id="spPublishBtn">儲存並上架</button>
          </div>
        </div>
      `;

      // 綁定圖片上傳預覽（實際接收 fillShopeeProductForm 注入的 DataTransfer File 物件！）
      const fileInput = document.getElementById('spFileInput');
      const gallery = document.getElementById('spImageGallery');
      const countLbl = document.getElementById('spImgCountLabel');
      fileInput.addEventListener('change', () => {
        const files = Array.from(fileInput.files || []);
        countLbl.textContent = `${files.length} / 9 張圖片`;
        gallery.innerHTML = '';
        files.forEach((file, idx) => {
          const url = URL.createObjectURL(file);
          const slot = document.createElement('div');
          slot.className = 'sp-img-slot';
          slot.innerHTML = `
            <img src="${url}" alt="${file.name}" />
            ${idx === 0 ? '<div class="sp-img-badge">封面首圖</div>' : ''}
          `;
          gallery.appendChild(slot);
        });
        if (files.length < 9) {
          const addBtn = document.createElement('label');
          addBtn.className = 'sp-img-add';
          addBtn.htmlFor = 'spFileInput';
          addBtn.innerHTML = `<span style="font-size:18px;">+</span><span>新增 (${files.length}/9)</span>`;
          gallery.appendChild(addBtn);
        }
      });

      const titleInput = document.getElementById('spTitleInput');
      const titleLen = document.getElementById('spTitleLen');
      titleInput.addEventListener('input', () => {
        titleLen.textContent = `${Array.from(titleInput.value).length}/60`;
      });

      // 分類快捷點選
      let selectedCat = '';
      document.getElementById('spCatPicks').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-cat]');
        if (!btn) return;
        selectedCat = btn.dataset.cat;
        document.querySelectorAll('.sp-cat-btn').forEach((b) => b.classList.toggle('is-selected', b === btn));
        document.getElementById('spCatBox').classList.add('is-filled');
        const st = document.getElementById('spCatStatus');
        st.style.color = '#2a6f4e';
        st.textContent = `已選擇分類：${selectedCat}`;
      });

      document.getElementById('spPublishBtn').addEventListener('click', () => {
        const footer = document.getElementById('spFooterBar');
        footer.innerHTML = `
          <span style="color:#2a6f4e;font-weight:600;font-size:13.5px;">
            ✓ 商品已成功刊登至蝦皮賣場！（${selectedCat || '預設分類'} · NT$${titleInput ? document.querySelector('[data-shopee-field="price"]').value : ''}）
          </span>
        `;
      });

      document.getElementById('spSaveDraftBtn').addEventListener('click', () => {
        const footer = document.getElementById('spFooterBar');
        footer.innerHTML = `<span style="color:#575653;font-weight:600;font-size:13.5px;">✓ 已儲存至蝦皮「尚未刊登」草稿區</span>`;
      });

      // 呼叫真實的擴充功能自動填表模組，並把填表結果回報給側邊欄（側邊欄據此決定成功／備援提示）
      const scopeDoc = document.getElementById('mockShopeeRoot');
      const filled = fillShopeeProductForm(scopeDoc, window, { ...payload, silentBanner: true });
      document.getElementById('spFrame')?.contentWindow?.postMessage(
        { type: 'LISTIO_MOCK_SHOPEE_RESULT', requestId: payload.requestId, filled },
        '*',
      );
    }

    function renderLeftWebpage(activeVariant = 0) {
      syncTabBar();
      const pane = document.getElementById('leftPane');

      if (currentMode === 'options') {
        pane.innerHTML = '<iframe src="extension/src/options/index.html?mock=1&tab=copy&v=13" title="品牌設定"></iframe>';
        return;
      }

      if (currentMode === 'shopee' && lastShopeePayload) {
        renderShopeeSellerPage(lastShopeePayload);
        return;
      }

      const it = ITEMS[currentKey];
      pane.innerHTML = `
        <div class="mock-urlbar">
          <div class="url-pill">
            <span>${it.url}</span>
            <span>點右側底部「一鍵帶入蝦皮後台」，可直接看自動開蝦皮分頁＋填表塞圖的完整流程</span>
          </div>
        </div>
        <div class="mock-item">
          <div class="mock-card">
            <div>
              <div class="gallery-main"><canvas id="mainArt" width="520" height="520"></canvas></div>
              <div class="gallery-thumbs" id="thumbRow">
                ${[0, 1, 2, 3].map((v) => `<canvas width="104" height="104" data-v="${v}" class="${v === activeVariant ? 'is-active' : ''}"></canvas>`).join('')}
              </div>
            </div>
            <div>
              <div class="item-shop">${it.shop}</div>
              <h1 class="item-title">${it.title}</h1>
              <div class="item-price-box">
                <span class="item-price-label">價格</span>
                <span class="item-price-val">¥ ${it.price}</span>
              </div>
              <div class="item-sku-row">
                <div class="item-sku-label">${it.skuLabel}</div>
                <div class="item-sku-opts">
                  ${it.skus.map((s) => `<span class="item-sku-opt">${s}</span>`).join('')}
                </div>
              </div>
              <div class="item-attrs">
                ${it.attrs.map(([k, v]) => `<div><span>${k}：</span>${v}</div>`).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      drawArt(document.getElementById('mainArt'), currentKey, activeVariant);
      document.querySelectorAll('#thumbRow canvas').forEach((c) => {
        const v = Number(c.dataset.v);
        drawArt(c, currentKey, v);
        c.addEventListener('click', () => renderLeftWebpage(v));
      });
    }

    document.getElementById('productTabs').addEventListener('click', (e) => {
      const shopeeTab = e.target.closest('[data-shopee-tab]');
      if (shopeeTab && lastShopeePayload) {
        currentMode = 'shopee';
        renderLeftWebpage();
        return;
      }
      const tab = e.target.closest('[data-product]');
      if (!tab) return;
      currentKey = tab.dataset.product;
      currentMode = 'item';
      renderLeftWebpage(0);

      const frame = document.getElementById('spFrame');
      frame.contentWindow?.postMessage({ type: 'LISTIO_SELECT_PRODUCT', key: currentKey }, '*');
    });

    document.getElementById('toggleOptionsBtn').addEventListener('click', () => {
      currentMode = currentMode === 'options' ? 'item' : 'options';
      renderLeftWebpage(0);
    });

    // 右側側邊欄的情境切換：初次引導 / 免費額度用完 / 一般工作台
    const SP_BASE = 'extension/src/sidepanel/index.html?mock=1&v=13';
    let spScenario = 'job';
    function setSidePanelScenario(next) {
      spScenario = spScenario === next ? 'job' : next;
      const frame = document.getElementById('spFrame');
      frame.src =
        spScenario === 'onboarding'
          ? `${SP_BASE}&view=onboarding&item=${currentKey}`
          : spScenario === 'quota'
            ? `${SP_BASE}&view=home&used=10&item=${currentKey}`
            : `${SP_BASE}&view=job&item=${currentKey}`;
      document.getElementById('toggleOnboardingBtn').classList.toggle('is-active', spScenario === 'onboarding');
      document.getElementById('toggleQuotaBtn').classList.toggle('is-active', spScenario === 'quota');
    }
    document.getElementById('toggleOnboardingBtn').addEventListener('click', () => setSidePanelScenario('onboarding'));
    document.getElementById('toggleQuotaBtn').addEventListener('click', () => setSidePanelScenario('quota'));

    window.addEventListener('message', (ev) => {
      if (ev.data?.type === 'LISTIO_OPEN_MOCK_SHOPEE' && ev.data.payload) {
        lastShopeePayload = ev.data.payload;
        document.getElementById('shopeeSimTab').classList.remove('hidden');
        currentMode = 'shopee';
        renderLeftWebpage();
      }
    });

    renderLeftWebpage(0);
  </script>
</body>
</html>
