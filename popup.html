<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; padding: 15px; font-family: sans-serif; }
    button { width: 100%; padding: 15px; cursor: pointer; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    #actionBtn { background: #ff5000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #downloadImageBtn { display: none; margin-top: 8px; background: #7a5d3a; }
    #previewWrapper { display: none; margin-top: 12px; }
    #previewWrapper p { margin: 0 0 6px; font-size: 12px; color: #5a5a5a; }
    #generatedPreview { width: 100%; border-radius: 8px; border: 1px solid #e5d6c5; }
    #result { margin-top: 15px; font-size: 13px; line-height: 1.6; color: #333; }
    .status { font-weight: bold; color: #0066cc; }

    /* 隱藏式 800x800 商品首圖模板（供 html2canvas 截圖） */
    #design-template {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 800px;
      height: 800px;
      box-sizing: border-box;
      overflow: hidden;
      background: #FFF9F3;
      border: 1px solid #e7d8c9;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(120, 94, 62, 0.1);
      color: #4A4A4A;
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
    }

    #design-template::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0) 35%),
        linear-gradient(140deg, rgba(255, 245, 236, 0.7), rgba(255, 249, 243, 0.95));
      z-index: 0;
    }

    .template-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: 28px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .brand-badge {
      position: absolute;
      left: 28px;
      top: 28px;
      z-index: 3;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 1px solid rgba(122, 93, 58, 0.45);
      background: rgba(255, 255, 255, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.45;
      font-size: 22px;
      letter-spacing: 1px;
      color: #7a5d3a;
    }

    .image-frame {
      flex: 1;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      border: 1px solid rgba(122, 93, 58, 0.2);
      overflow: hidden;
      background: #f8efe6;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fffdf9;
    }

    .title-overlay {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 28px;
      z-index: 2;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(122, 93, 58, 0.16);
      border-radius: 12px;
      padding: 20px 24px;
      min-height: 122px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #templateTitle {
      margin: 0;
      font-size: 38px;
      color: #4A4A4A;
      line-height: 1.4;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.5px;
      word-break: break-word;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <label>💰 設定商品價格 (Col M):</label>
  <input type="number" id="itemPrice" placeholder="例如：290" value="">

  <button id="actionBtn">🚀 一鍵完成 (抓取+文案+Excel)</button>
  <button id="downloadImageBtn">⬇️ 下載商品首圖</button>
  <div id="previewWrapper">
    <p>商品首圖預覽：</p>
    <img id="generatedPreview" alt="商品首圖預覽">
  </div>
  <div id="result"></div>

  <div id="design-template" aria-hidden="true">
    <div class="template-inner">
      <div class="brand-badge">Mimi<br>飾物所</div>
      <div class="image-frame">
        <img id="templateProductImage" alt="商品圖片">
      </div>
      <div class="title-overlay">
        <h2 id="templateTitle"></h2>
      </div>
    </div>
  </div>

  <script src="html2canvas.min.js"></script>
  <script src="xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
